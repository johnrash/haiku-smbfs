<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310" role="img" aria-label="Data path through the file cache">
  <style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
  .box { fill: #fff; stroke: #57606a; stroke-width: 1.2; }
  .box.k { fill: #eef5fc; stroke: #0b5cad; }
  .box.u { fill: #fdf3e2; stroke: #c48a00; }
  .box.n { fill: #eaf4ea; stroke: #2f7d32; }
  .box.c { fill: #f3f0fa; stroke: #6a4fb3; }
  .lane { fill: none; stroke: #d0d7de; stroke-dasharray: 4 4; }
  .arrow { stroke: #57606a; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
  .label { fill: #57606a; font-size: 11px; }
  .title { font-weight: 600; font-size: 13px; }
</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="30" width="160" height="50" class="box u" rx="6"/><text x="100" y="52" text-anchor="middle" class="title">read() / write()</text><text x="100" y="69" text-anchor="middle" class="label">user buffer</text>
  <rect x="20" y="130" width="160" height="50" class="box u" rx="6"/><text x="100" y="152" text-anchor="middle" class="title">mmap / exec</text><text x="100" y="169" text-anchor="middle" class="label">page faults</text>
  <rect x="260" y="30" width="200" height="50" class="box" rx="6"/><text x="360" y="52" text-anchor="middle" class="title">Inode::Read / Write</text><text x="360" y="69" text-anchor="middle" class="label">_SyncCache(), size tracking</text>
  <rect x="520" y="60" width="200" height="90" class="box k" rx="6"/><text x="620" y="84" text-anchor="middle" class="title">Haiku file cache</text><text x="620" y="102" text-anchor="middle" class="label">file_cache_read/write</text><text x="620" y="118" text-anchor="middle" class="label">VM page cache, page writer</text><text x="620" y="134" text-anchor="middle" class="label">file_cache_set_size/disable/enable</text>
  <rect x="520" y="200" width="200" height="50" class="box" rx="6"/><text x="620" y="222" text-anchor="middle" class="title">read_pages / write_pages</text><text x="620" y="239" text-anchor="middle" class="label">kernel page vecs, temp handles</text>
  <rect x="780" y="200" width="180" height="50" class="box c" rx="6"/><text x="870" y="222" text-anchor="middle" class="title">Connection::Read/Write</text><text x="870" y="239" text-anchor="middle" class="label">1 MiB chunks, credits</text>
  <path d="M180 55 L260 55" class="arrow"/><path d="M460 55 L520 80" class="arrow"/>
  <path d="M180 155 L520 115" class="arrow"/>
  <path d="M620 150 L620 200" class="arrow"/><path d="M720 225 L780 225" class="arrow"/>
  <path d="M260 70 L260 230 L520 230" class="arrow"/><text x="270" y="268" class="label">fallback without a cache: bounce buffer + user_memcpy()</text>
  <text x="20" y="298" class="label">Cache changes (invalidate, resize) are flagged under the inode lock and applied lazily at VFS hook entry, never from inside read_pages/write_pages and never under the tree lock.</text>
</svg>
