<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Layered architecture diagram">
  <style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
  .box { fill: #fff; stroke: #57606a; stroke-width: 1.2; }
  .box.k { fill: #eef5fc; stroke: #0b5cad; }
  .box.u { fill: #fdf3e2; stroke: #c48a00; }
  .box.n { fill: #eaf4ea; stroke: #2f7d32; }
  .box.c { fill: #f3f0fa; stroke: #6a4fb3; }
  .lane { fill: none; stroke: #d0d7de; stroke-dasharray: 4 4; }
  .arrow { stroke: #57606a; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
  .label { fill: #57606a; font-size: 11px; }
  .title { font-weight: 600; font-size: 13px; }
</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="960" height="150" class="lane"/>
  <text x="20" y="28" class="title">Userland</text>
  <rect x="30" y="45" width="150" height="54" class="box u" rx="6"/><text x="105" y="67" text-anchor="middle" class="title">Tracker</text><text x="105" y="85" text-anchor="middle" class="label">windows, node monitor</text>
  <rect x="200" y="45" width="150" height="54" class="box u" rx="6"/><text x="275" y="67" text-anchor="middle" class="title">Terminal / apps</text><text x="275" y="85" text-anchor="middle" class="label">cp, ls, mmap, exec</text>
  <rect x="370" y="45" width="150" height="54" class="box u" rx="6"/><text x="445" y="67" text-anchor="middle" class="title">mount_smbfs</text><text x="445" y="85" text-anchor="middle" class="label">CLI, mount point policy</text>
  <rect x="540" y="45" width="170" height="54" class="box u" rx="6"/><text x="625" y="67" text-anchor="middle" class="title">SMBMounter</text><text x="625" y="85" text-anchor="middle" class="label">GUI, keystore, hey scripting</text>
  <rect x="740" y="45" width="210" height="54" class="box u" rx="6"/><text x="845" y="67" text-anchor="middle" class="title">registrar / keystore_server</text><text x="845" y="85" text-anchor="middle" class="label">MIME types, passwords</text>
  <text x="105" y="135" text-anchor="middle" class="label">POSIX I/O, entry_ref, attributes</text>
  <text x="530" y="135" text-anchor="middle" class="label">fs_mount_volume() / fs_unmount_volume()</text>
  <rect x="10" y="170" width="960" height="260" class="lane"/>
  <text x="20" y="188" class="title">Kernel</text>
  <rect x="30" y="200" width="920" height="40" class="box" rx="6"/><text x="490" y="224" text-anchor="middle" class="title">Haiku VFS (vnodes, file descriptors, entry cache, node monitor, file cache / VM page cache)</text>
  <rect x="30" y="265" width="920" height="150" class="box k" rx="6"/>
  <text x="48" y="286" class="title">smbfs kernel add-on</text>
  <rect x="48" y="298" width="200" height="100" class="box" rx="6"/><text x="148" y="318" text-anchor="middle" class="title">kernel_interface.cpp</text><text x="148" y="336" text-anchor="middle" class="label">fs_volume_ops / fs_vnode_ops</text><text x="148" y="352" text-anchor="middle" class="label">live-volume registry, zombies</text><text x="148" y="368" text-anchor="middle" class="label">virtual BEOS:TYPE attribute</text><text x="148" y="384" text-anchor="middle" class="label">notifications</text>
  <rect x="268" y="298" width="200" height="100" class="box" rx="6"/><text x="368" y="318" text-anchor="middle" class="title">Volume / Inode</text><text x="368" y="336" text-anchor="middle" class="label">mount options, inode table</text><text x="368" y="352" text-anchor="middle" class="label">name tree, path building</text><text x="368" y="368" text-anchor="middle" class="label">attribute cache, handles</text><text x="368" y="384" text-anchor="middle" class="label">file cache integration</text>
  <rect x="488" y="298" width="220" height="100" class="box c" rx="6"/><text x="598" y="318" text-anchor="middle" class="title">smb2::Connection (core)</text><text x="598" y="336" text-anchor="middle" class="label">negotiate, session, tree connect</text><text x="598" y="352" text-anchor="middle" class="label">framing, credits, compounding</text><text x="598" y="368" text-anchor="middle" class="label">signing, encryption, reconnect</text><text x="598" y="384" text-anchor="middle" class="label">NTLMSSP, crypto, UTF-16</text>
  <rect x="728" y="298" width="204" height="100" class="box" rx="6"/><text x="830" y="318" text-anchor="middle" class="title">kernel services</text><text x="830" y="336" text-anchor="middle" class="label">socket(), send(), recv(), poll()</text><text x="830" y="352" text-anchor="middle" class="label">dns_resolver module</text><text x="830" y="368" text-anchor="middle" class="label">mutex / rw_lock, malloc</text><text x="830" y="384" text-anchor="middle" class="label">secure_random_value()</text>
  <rect x="10" y="440" width="960" height="110" class="lane"/>
  <text x="20" y="458" class="title">Network</text>
  <rect x="330" y="475" width="320" height="54" class="box n" rx="6"/><text x="490" y="497" text-anchor="middle" class="title">SMB server (Samba, Windows, NAS)</text><text x="490" y="515" text-anchor="middle" class="label">TCP 445, SMB2/SMB3 direct hosting</text>
  <path d="M105 99 L105 200" class="arrow"/><path d="M275 99 L275 200" class="arrow"/><path d="M445 99 L445 200" class="arrow"/><path d="M625 99 L625 200" class="arrow"/>
  <path d="M490 240 L490 265" class="arrow"/>
  <path d="M248 348 L268 348" class="arrow"/><path d="M468 348 L488 348" class="arrow"/><path d="M708 348 L728 348" class="arrow"/>
  <path d="M830 398 L830 430 L490 430 L490 475" class="arrow"/>
</svg>
