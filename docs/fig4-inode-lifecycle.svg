<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310" role="img" aria-label="Inode lifecycle">
  <style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
  .box { fill: #fff; stroke: #57606a; stroke-width: 1.2; }
  .box.k { fill: #eef5fc; stroke: #0b5cad; }
  .box.u { fill: #fdf3e2; stroke: #c48a00; }
  .box.n { fill: #eaf4ea; stroke: #2f7d32; }
  .box.c { fill: #f3f0fa; stroke: #6a4fb3; }
  .lane { fill: none; stroke: #d0d7de; stroke-dasharray: 4 4; }
  .arrow { stroke: #57606a; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
  .label { fill: #57606a; font-size: 11px; }
  .title { font-weight: 600; font-size: 13px; }
</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="70" width="140" height="56" class="box" rx="6"/><text x="90" y="94" text-anchor="middle" class="title">Known</text><text x="90" y="111" text-anchor="middle" class="label">in table + name tree</text>
  <rect x="280" y="70" width="140" height="56" class="box k" rx="6"/><text x="350" y="94" text-anchor="middle" class="title">Published</text><text x="350" y="111" text-anchor="middle" class="label">VFS vnode loaded</text>
  <rect x="540" y="70" width="140" height="56" class="box u" rx="6"/><text x="610" y="94" text-anchor="middle" class="title">Detached</text><text x="610" y="111" text-anchor="middle" class="label">unlinked from tree</text>
  <rect x="800" y="70" width="140" height="56" class="box" rx="6"/><text x="870" y="94" text-anchor="middle" class="title">Freed</text><text x="870" y="111" text-anchor="middle" class="label">memory released</text>
  <path d="M160 88 L280 88" class="arrow"/><text x="220" y="82" text-anchor="middle" class="label">get_vnode hook</text>
  <path d="M280 110 L160 110" class="arrow"/><text x="220" y="124" text-anchor="middle" class="label">put_vnode hook</text>
  <path d="M420 98 L540 98" class="arrow"/><text x="474" y="80" text-anchor="middle" class="label">unlink, rename over,</text><text x="474" y="92" text-anchor="middle" class="label">type change, ENOENT</text>
  <path d="M680 98 L800 98" class="arrow"/><text x="740" y="92" text-anchor="middle" class="label">remove_vnode hook</text>
  <path d="M90 70 L90 36 L610 36 L610 70" class="arrow"/><text x="350" y="30" text-anchor="middle" class="label">not published: DetachInode() unlinks it directly</text>
  <path d="M610 126 L610 160 L870 160 L870 126" class="arrow"/><text x="740" y="176" text-anchor="middle" class="label">unpublished: deleted immediately</text>
  <text x="20" y="215" class="title">Rules</text>
  <text x="20" y="235" class="label">• "Published" is set only by the get_vnode hook and cleared only by the put_vnode/remove_vnode hooks: the VFS keeps unreferenced vnodes cached, so nothing else may free an inode.</text>
  <text x="20" y="253" class="label">• Detaching a published inode goes through the VFS: get_vnode() + remove_vnode() + put_vnode(), and the remove_vnode hook frees it. Subtrees are detached recursively.</text>
  <text x="20" y="271" class="label">• Lock order: tree rw-lock → inode mutex → table mutex. No network I/O and no file cache calls while holding the tree lock.</text>
</svg>
